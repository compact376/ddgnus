services:
  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api_gateway/Dockerfile
    image: ddgnus/api-gateway:latest
    ports:
      - '8080:8080'
    env_file:
      - backend/.env
    environment:
      GATEWAY_PORT: '8080'
      PAYMENT_SERVICE_URL: 'http://payment-service:8081'
      ALLOWED_ORIGIN: 'http://localhost:3000'
    depends_on:
      - payment-service

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    image: ddgnus/payment-service:latest
    ports:
      - '8083:8081'
    env_file:
      - backend/.env
    environment:
      PORT: '8081'
      ENVIRONMENT: 'development'
    depends_on: []

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ddgnus/frontend:latest
    ports:
      - '3000:80'
    env_file:
      - .env
    depends_on:
      - api-gateway
      - payment-service
